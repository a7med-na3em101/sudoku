<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Over</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }

      h1 {
        font-size: 4rem;
        color: red;
        margin-bottom: 20px;
      }

      p {
        font-size: 1.5rem;
        margin-bottom: 30px;
      }

      button {
        padding: 15px 30px;
        font-size: 1rem;
        background-color: #ff4747;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #e33636;
      }
    </style>
  </head>
  <body>
    <h1>Game Over</h1>
    <p>Better luck next time!</p>
    <button onclick="retry()">Try Again</button>

    <script>
      function retry() {
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
